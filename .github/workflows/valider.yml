name: Valider les examens

on:
  push:
    branches: [main]
  pull_request:

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Contrôle des fichiers d'examen
        run: node tools/valider.mjs
